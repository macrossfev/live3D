<!DOCTYPE html><html><head><meta charset="utf-8">
<title>迪迦 · Kicking（Mixamo 绑骨版）</title>
<style>body{margin:0;background:#0e1118;color:#dde;overflow-x:hidden}
#hud{position:fixed;top:8px;left:8px;font:12px/1.6 monospace;color:#7ef;white-space:pre;z-index:9}
#tip{position:fixed;bottom:8px;left:8px;font:12px monospace;color:#567;z-index:9}
</style>
<script type="importmap">{"imports":{
"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}</script>
</head><body><div id="hud">加载迪迦(Kicking)…</div><div id="tip">拖转 · 滚轮缩放</div>
<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const W = 620, H = 900;
const r = new THREE.WebGLRenderer({ antialias: true });
r.setSize(W, H); document.body.appendChild(r.domElement);
const s = new THREE.Scene();
s.background = new THREE.Color(.05, .055, .07);
const cam = new THREE.PerspectiveCamera(32, W / H, .1, 80);
s.add(new THREE.AmbientLight(0xffffff, .95));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(2, 3, 5); s.add(sun);
const rim = new THREE.DirectionalLight(0x88bbff, .8); rim.position.set(-2, 2, -3); s.add(rim);
s.add(new THREE.GridHelper(5, 10));
const ctl = new OrbitControls(cam, r.domElement);
ctl.target.set(0, 1.0, 0); cam.position.set(.8, 1.3, 3.8);
const TL = new THREE.TextureLoader();
const T = (u, nc) => { const t = TL.load(u); if (nc) t.colorSpace = THREE.NoColorSpace; else t.colorSpace = THREE.SRGBColorSpace; return t; };
window.__stats = { stage: 'loading' };
new FBXLoader().load('../assets/samples/Kicking.fbx', model => {
  model.scale.setScalar(.01);                       // Mixamo 厘米 → 米
  model.traverse(o => {
    if (o.isSkinnedMesh){
      o.material = new THREE.MeshStandardMaterial({
        map: T('../assets/output/tiga_base1024.png'),   // 迪迦.png 才是真基色(RGB版是蓝底通道图)
        emissiveMap: T('../assets/output/tiga_emis1024.png'),
        emissive: new THREE.Color(1, 1, 1), emissiveIntensity: 1.1,
        normalMap: T('../assets/output/tiga_nrm1024.png', true),
        roughness: .55, metalness: .05,
      });
      o.frustumCulled = false;
    }
  });
  s.add(model);
  const mixer = new THREE.AnimationMixer(model);
  mixer.clipAction(model.animations[0]).play();
  window.__stats = { stage: 'ok', anim: model.animations[0].name + ' ' + model.animations[0].duration.toFixed(2) + 's',
                     mixerRunning: true };
  document.getElementById('hud').textContent = '迪迦 · Kicking（Mixamo 原生绑骨 + 现场穿皮）\n动作: ' + window.__stats.anim;
  document.title = 'OK';
  const clock = new THREE.Clock();
  (function loop(){ requestAnimationFrame(loop); mixer.update(clock.getDelta()); ctl.update(); r.render(s, cam); })();
}, undefined, e => { document.getElementById('hud').textContent = '失败 ' + e; document.title = 'ERR'; });
</script></body></html>
