<!DOCTYPE html><html><head><meta charset="utf-8">
<title>迪迦 · 会打了</title>
<style>body{margin:0;background:#0e1118;color:#dde;overflow-x:hidden}
#hud{position:fixed;top:8px;left:8px;font:12px/1.6 monospace;color:#7ef;white-space:pre;z-index:9}
#tip{position:fixed;bottom:8px;left:8px;font:12px monospace;color:#567;z-index:9}
</style>
<script type="importmap">{"imports":{
"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}</script>
</head><body><div id="hud">加载迪迦…</div><div id="tip">1/2 切动作 · 拖转 · 滚轮缩放</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const W = 620, H = 900;   // 本机玄学宽度
const r = new THREE.WebGLRenderer({ antialias: true });
r.setSize(W, H); document.body.appendChild(r.domElement);
const s = new THREE.Scene();
s.background = new THREE.Color(.05, .055, .07);
const cam = new THREE.PerspectiveCamera(32, W / H, .1, 60);
s.add(new THREE.AmbientLight(0xffffff, .9));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(2, 3, 5); s.add(sun);
const rim = new THREE.DirectionalLight(0x88bbff, .8); rim.position.set(-2, 2, -3); s.add(rim);
s.add(new THREE.GridHelper(5, 10));
const ctl = new OrbitControls(cam, r.domElement);
ctl.target.set(0, 1.0, 0);
cam.position.set(.6, 1.3, 3.6);

let mixer = null, actions = [];
window.__stats = { stage: 'loading' };
new GLTFLoader().load('../assets/output/tiga_rigged.glb', g => {
  const model = g.scene;
  model.scale.setScalar(1.8 / 2.08);          // 归一到 1.8m
  s.add(model);
  mixer = new THREE.AnimationMixer(model);
  for (const clip of g.animations){
    actions.push({ clip, act: mixer.clipAction(clip) });
  }
  actions.forEach((a, i) => a.act.play());
  // 双动作交替：只激活一个，8 秒一切
  let cur = 0;
  actions.forEach((a, i) => a.act.setEffectiveWeight(i === 0 ? 1 : 0));
  setInterval(() => {
    cur = 1 - cur;
    actions.forEach((a, i) => a.act.setEffectiveWeight(i === cur ? 1 : 0));
  }, 8000);
  window.__stats = { stage: 'ok', anims: g.animations.map(a => a.name + ' ' + a.duration.toFixed(2) + 's') };
  document.getElementById('hud').textContent =
    '迪迦 · 自动绑骨 + 贴图\n动作: ' + window.__stats.anims.join(' / ') + '\n每 8 秒自动切换（或按 1/2）';
  document.title = 'OK';
}, undefined, e => { document.getElementById('hud').textContent = '失败 ' + e; document.title = 'ERR'; });
addEventListener('keydown', e => {
  if (!actions.length) return;
  const i = parseInt(e.key) - 1;
  if (i >= 0 && i < actions.length) actions.forEach((a, j) => a.act.setEffectiveWeight(j === i ? 1 : 0));
});
window.__freeze = () => { if (mixer) mixer.timeScale = 0; return 'frozen'; };
const clock = new THREE.Clock();
(function loop(){ requestAnimationFrame(loop); if (mixer) mixer.update(clock.getDelta()); ctl.update(); r.render(s, cam); })();
</script></body></html>
