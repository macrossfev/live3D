<!DOCTYPE html><html><head><meta charset="utf-8">
<title>迪迦 · 四动作台</title>
<style>body{margin:0;background:#0e1118;color:#dde;overflow-x:hidden}
#hud{position:fixed;top:8px;left:8px;font:12px/1.6 monospace;color:#7ef;white-space:pre;z-index:9}
#keys{position:fixed;bottom:8px;left:8px;font:13px monospace;z-index:9}
#keys b{color:#ffd34d}
#keys span{display:inline-block;background:#1c2434;border:1px solid #2c3a52;border-radius:6px;padding:2px 10px;margin-right:6px}
#keys span.on{background:#2a5daa;color:#fff}
</style>
<script type="importmap">{"imports":{
"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}</script>
</head><body><div id="hud">加载迪迦四动作…</div>
<div id="keys"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const W = 620, H = 900;
const r = new THREE.WebGLRenderer({ antialias: true });
r.setSize(W, H); document.body.appendChild(r.domElement);
const s = new THREE.Scene();
s.background = new THREE.Color(.05, .055, .07);
const cam = new THREE.PerspectiveCamera(32, W / H, .1, 80);
s.add(new THREE.AmbientLight(0xffffff, .95));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(2, 3, 5); s.add(sun);
const rim = new THREE.DirectionalLight(0x88bbff, .8); rim.position.set(-2, 2, -3); s.add(rim);
s.add(new THREE.GridHelper(5, 10));
const ctl = new OrbitControls(cam, r.domElement);
ctl.target.set(0, 1.0, 0); cam.position.set(.8, 1.3, 3.8);
let mixer = null, actions = [], cur = 0;
window.__stats = { stage: 'loading' };
function select(i){
  if (!actions.length) return;
  cur = i;
  actions.forEach((a, j) => a.setEffectiveWeight(j === i ? 1 : 0));
  document.querySelectorAll('#keys span').forEach((el, j) => el.classList.toggle('on', j === i));
}
new GLTFLoader().load('../assets/output/tiga_motions.glb', g => {
  g.scene.traverse(o => { if (o.isSkinnedMesh) o.frustumCulled = false; });
  s.add(g.scene);
  mixer = new THREE.AnimationMixer(g.scene);
  for (const clip of g.animations) actions.push(mixer.clipAction(clip));
  actions.forEach(a => a.play());
  const names = g.animations.map(a => a.name);
  window.__stats = { stage: 'ok', anims: names };
  document.getElementById('hud').textContent = '迪迦 · ' + names.length + ' 动作（按 1-' + names.length + ' 切换）';
  document.getElementById('keys').innerHTML = names.map((n, i) =>
    '<span>' + (i+1) + ' ' + n + '</span>').join(' ');
  select(0);
  document.title = 'OK';
}, ev => { if (ev.total) document.getElementById('hud').textContent = '下载… ' + Math.round(ev.loaded/ev.total*100) + '%'; },
e => { document.getElementById('hud').textContent = '失败 ' + e; document.title = 'ERR'; });
addEventListener('keydown', e => { const i = parseInt(e.key) - 1; if (i >= 0 && i < actions.length) select(i); });
window.__sel = select;
const clock = new THREE.Clock();
(function loop(){ requestAnimationFrame(loop); if (mixer) mixer.update(clock.getDelta()); ctl.update(); r.render(s, cam); })();
</script></body></html>
